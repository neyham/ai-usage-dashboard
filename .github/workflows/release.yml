name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test renderer
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Windows installers
        run: npm run app:build

      - name: Install, reinstall, launch and uninstall Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:RUNNER_TEMP 'dashboard-previous'
          gh release download v0.8.6 --repo $env:GITHUB_REPOSITORY --dir $old --pattern '*x64-setup.exe' --pattern '*x64_en-US.msi'
          if ($LASTEXITCODE -ne 0) { throw 'Previous release download failed' }
          function Run-Installer($file, $arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -notin @(0, 3010)) { throw "Installer failed: $file ($($p.ExitCode))" }
          }
          function Test-InstalledApp($exe) {
            if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
            $app = Start-Process -FilePath $exe -ArgumentList '--judge-demo' -PassThru
            try {
              Start-Sleep -Seconds 10
              if ($app.HasExited) { throw "Installed app exited: $($app.ExitCode)" }
              Write-Host "PASS installed application startup: $exe"
            } finally {
              if (-not $app.HasExited) { Stop-Process -Id $app.Id; $app.WaitForExit() }
            }
          }
          $nsis = (Get-ChildItem src-tauri/target/release/bundle/nsis/*_0.8.7_x64-setup.exe | Select-Object -First 1).FullName
          $payloadDir = Join-Path $env:RUNNER_TEMP 'dashboard-nsis-payload'
          7z x $nsis "-o$payloadDir" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Unable to extract NSIS payload' }
          $payload = (Get-ChildItem $payloadDir -Recurse -Filter 'ai-usage-dashboard.exe' | Select-Object -First 1).FullName
          if (-not $payload) { throw 'NSIS executable payload missing' }
          Write-Host "NSIS payload version: $((Get-Item $payload).VersionInfo.ProductVersion)"
          if ((Get-Item $payload).VersionInfo.ProductVersion -notlike '0.8.7*') { throw 'NSIS payload is not version 0.8.7' }
          $dest = Join-Path $env:RUNNER_TEMP 'dashboard-nsis'
          Run-Installer (Join-Path $old 'AI-Usage-Dashboard_0.8.6_x64-setup.exe') "/S /D=$dest"
          Test-InstalledApp (Join-Path $dest 'ai-usage-dashboard.exe')
          Write-Host "Installing candidate: $nsis"
          Run-Installer $nsis "/S /D=$dest"
          Write-Host "Installed version: $((Get-Item (Join-Path $dest 'ai-usage-dashboard.exe')).VersionInfo.ProductVersion)"
          Write-Host "Payload hash: $((Get-FileHash $payload).Hash); installed hash: $((Get-FileHash (Join-Path $dest 'ai-usage-dashboard.exe')).Hash)"
          if ((Get-FileHash (Join-Path $dest 'ai-usage-dashboard.exe')).Hash -ne (Get-FileHash $payload).Hash) { throw 'NSIS did not install the new binary' }
          Test-InstalledApp (Join-Path $dest 'ai-usage-dashboard.exe')
          Write-Host "Installing candidate: $nsis"
          Run-Installer $nsis "/S /D=$dest"
          Write-Host "Installed version: $((Get-Item (Join-Path $dest 'ai-usage-dashboard.exe')).VersionInfo.ProductVersion)"
          Write-Host "Payload hash: $((Get-FileHash $payload).Hash); installed hash: $((Get-FileHash (Join-Path $dest 'ai-usage-dashboard.exe')).Hash)"
          if ((Get-FileHash (Join-Path $dest 'ai-usage-dashboard.exe')).Hash -ne (Get-FileHash $payload).Hash) { throw 'NSIS did not install the new binary' }
          Test-InstalledApp (Join-Path $dest 'ai-usage-dashboard.exe')
          $uninstaller = (Get-ChildItem $dest -Filter '*uninstall*.exe' | Select-Object -First 1).FullName
          if (-not $uninstaller) { throw 'NSIS uninstaller missing' }
          Run-Installer $uninstaller '/S'
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dest 'ai-usage-dashboard.exe')) { throw 'NSIS uninstall left executable behind' }
          Write-Host 'PASS NSIS 0.8.6-to-0.8.7 upgrade/reinstall/uninstall'
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi/*_0.8.7_x64_en-US.msi | Select-Object -First 1).FullName
          $msiPayloadDir = Join-Path $env:RUNNER_TEMP 'dashboard-msi-payload'
          Run-Installer 'msiexec.exe' "/a `"$msi`" /qn TARGETDIR=`"$msiPayloadDir`""
          $msiPayload = (Get-ChildItem $msiPayloadDir -Recurse -Filter 'ai-usage-dashboard.exe' | Select-Object -First 1).FullName
          if (-not $msiPayload -or (Get-Item $msiPayload).VersionInfo.ProductVersion -notlike '0.8.7*') { throw 'MSI payload is not version 0.8.7' }
          $msiDest = Join-Path $env:RUNNER_TEMP 'dashboard-msi'
          $oldMsi = Join-Path $old 'AI-Usage-Dashboard_0.8.6_x64_en-US.msi'
          Run-Installer 'msiexec.exe' "/i `"$oldMsi`" /qn /norestart"
          $msiLog = Join-Path $env:RUNNER_TEMP 'dashboard-msi-install.log'
          Run-Installer 'msiexec.exe' "/i `"$msi`" /qn /norestart /L*v `"$msiLog`" INSTALLDIR=`"$msiDest`""
          # WiX can restore the previous NSIS directory from the product registry.
          # Validate the registered MSI location, not an assumed command-line override.
          $entries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'AI Usage Dashboard' -and $_.WindowsInstaller -eq 1 })
          if ($entries.Count -ne 1 -or -not $entries[0].InstallLocation) {
            Get-Content $msiLog -Tail 100
            throw 'Expected exactly one MSI registration with an install location'
          }
          if ($entries[0].DisplayVersion -ne '0.8.7') { throw 'MSI upgrade did not register 0.8.7' }
          $msiDest = $entries[0].InstallLocation
          Write-Host "MSI payload version: $((Get-Item $msiPayload).VersionInfo.ProductVersion); installed version: $((Get-Item (Join-Path $msiDest 'ai-usage-dashboard.exe')).VersionInfo.ProductVersion)"
          if ((Get-FileHash (Join-Path $msiDest 'ai-usage-dashboard.exe')).Hash -ne (Get-FileHash $msiPayload).Hash) { throw 'MSI did not install the new binary' }
          Write-Host "Registered MSI location: $msiDest"
          Test-InstalledApp (Join-Path $msiDest 'ai-usage-dashboard.exe')
          Run-Installer 'msiexec.exe' "/fa `"$msi`" /qn /norestart"
          Test-InstalledApp (Join-Path $msiDest 'ai-usage-dashboard.exe')
          Run-Installer 'msiexec.exe' "/x `"$msi`" /qn /norestart"
          if (Test-Path (Join-Path $msiDest 'ai-usage-dashboard.exe')) { throw 'MSI uninstall left executable behind' }
          Write-Host 'PASS MSI 0.8.6-to-0.8.7 upgrade/repair/uninstall'

      - name: Stage release assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          $nsis = "src-tauri/target/release/bundle/nsis/AI Usage Dashboard_${version}_x64-setup.exe"
          if (-not (Test-Path $nsis)) { throw "NSIS installer missing: $nsis" }
          Copy-Item $nsis "release/AI-Usage-Dashboard_${version}_x64-setup.exe"
          $msi = "src-tauri/target/release/bundle/msi/AI Usage Dashboard_${version}_x64_en-US.msi"
          if (Test-Path $msi) {
            Copy-Item $msi "release/AI-Usage-Dashboard_${version}_x64_en-US.msi"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test renderer
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Linux bundles
        run: npm run app:build

      - name: Install, reinstall, launch and uninstall Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/dashboard-previous"
          gh release download v0.8.6 --repo "$GITHUB_REPOSITORY" --dir "$old" --pattern '*amd64.deb' --pattern '*amd64.AppImage'
          smoke() {
            set +e
            xvfb-run -a timeout 10s "$@" --judge-demo
            result=$?
            set -e
            test "$result" -eq 124
            echo "PASS installed application startup: $*"
          }
          deb=$(find src-tauri/target/release/bundle/deb -name '*_0.8.7_amd64.deb' -print -quit)
          package=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "$old/AI-Usage-Dashboard_0.8.6_amd64.deb"
          smoke /usr/bin/ai-usage-dashboard
          sudo apt-get install -y "$PWD/$deb"
          expected="$RUNNER_TEMP/dashboard-deb-payload"
          dpkg-deb -x "$deb" "$expected"
          cmp /usr/bin/ai-usage-dashboard "$expected/usr/bin/ai-usage-dashboard"
          test "$(dpkg-query -W -f='${Version}' "$package")" = '0.8.7'
          smoke /usr/bin/ai-usage-dashboard
          sudo dpkg -i "$deb"
          smoke /usr/bin/ai-usage-dashboard
          sudo dpkg --purge "$package"
          test ! -e /usr/bin/ai-usage-dashboard
          echo 'PASS DEB 0.8.6-to-0.8.7 upgrade/reinstall/uninstall'
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*_0.8.7_amd64.AppImage' -print -quit)
          installed="$RUNNER_TEMP/dashboard.AppImage"
          install -m 755 "$old/AI-Usage-Dashboard_0.8.6_amd64.AppImage" "$installed"
          smoke env APPIMAGE_EXTRACT_AND_RUN=1 "$installed"
          install -m 755 "$appimage" "$installed"
          smoke env APPIMAGE_EXTRACT_AND_RUN=1 "$installed"
          install -m 755 "$appimage" "$installed"
          smoke env APPIMAGE_EXTRACT_AND_RUN=1 "$installed"
          rm "$installed"
          test ! -e "$installed"
          echo 'PASS AppImage copy/replacement/removal (extract-and-run; no FUSE)'

      - name: Stage release assets
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          deb="$(find src-tauri/target/release/bundle/deb -type f -name "*_${version}_*.deb" -print -quit)"
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name "*_${version}_*.AppImage" -print -quit)"
          test -n "${deb}" || { echo "deb bundle missing"; exit 1; }
          test -n "${appimage}" || { echo "AppImage bundle missing"; exit 1; }
          cp "${deb}" "release/AI-Usage-Dashboard_${version}_amd64.deb"
          cp "${appimage}" "release/AI-Usage-Dashboard_${version}_amd64.AppImage"
          cp scripts/install-linux.sh release/install-linux.sh
          chmod 755 release/install-linux.sh release/*.AppImage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test renderer
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build macOS bundles
        run: npm run app:build

      - name: Install, replace, launch and remove app from DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/dashboard-previous"
          gh release download v0.8.6 --repo "$GITHUB_REPOSITORY" --dir "$old" --pattern '*aarch64.dmg'
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*_0.8.7_*.dmg' -print -quit)
          mount="$RUNNER_TEMP/dashboard-volume"
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$mount" "$apps"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          source_app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$source_app"
          installed="$apps/AI Usage Dashboard.app"
          smoke() {
            "$installed/Contents/MacOS/ai-usage-dashboard" --judge-demo &
            app_pid=$!
            sleep 10
            kill -0 "$app_pid"
            kill "$app_pid"
            wait "$app_pid" || true
            echo 'PASS installed macOS application startup'
          }
          old_mount="$RUNNER_TEMP/dashboard-previous-volume"
          mkdir -p "$old_mount"
          hdiutil attach "$old/AI-Usage-Dashboard_0.8.6_aarch64.dmg" -nobrowse -readonly -mountpoint "$old_mount"
          ditto "$old_mount/AI Usage Dashboard.app" "$installed"
          smoke
          hdiutil detach "$old_mount"
          rm -rf "$installed"
          ditto "$source_app" "$installed"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$installed/Contents/Info.plist")" = '0.8.7'
          smoke
          rm -rf "$installed"
          ditto "$source_app" "$installed"
          smoke
          rm -rf "$installed"
          test ! -e "$installed"
          hdiutil detach "$mount"
          trap - EXIT
          echo 'PASS DMG 0.8.6-to-0.8.7 replacement/startup/removal'

      - name: Stage release assets
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          mkdir -p release
          dmg="$(find src-tauri/target/release/bundle/dmg -type f -name "*_${version}_*.dmg" -print -quit)"
          test -n "${dmg}" || { echo "dmg bundle missing"; exit 1; }
          arch="$(uname -m)"
          case "${arch}" in
            arm64) arch_tag="aarch64" ;;
            x86_64) arch_tag="x64" ;;
            *) echo "unsupported macOS arch: ${arch}"; exit 1 ;;
          esac
          cp "${dmg}" "release/AI-Usage-Dashboard_${version}_${arch_tag}.dmg"
          cp scripts/install-macos.sh release/install-macos.sh
          chmod 755 release/install-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: release

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: release

      - name: Build checksum file
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          cd release
          # Exclude the checksum file itself from hashing.
          find . -type f ! -name 'AI-Usage-Dashboard_*_SHA256SUMS.txt' -printf '%P\n' \
            | sort \
            | while IFS= read -r file; do
                sha256sum "${file}"
              done \
            | sed 's|  \./|  |' \
            > "AI-Usage-Dashboard_${version}_SHA256SUMS.txt"
          ls -la
          cat "AI-Usage-Dashboard_${version}_SHA256SUMS.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "${notes}" ]; then
            notes="$(mktemp)"
            printf 'AI Usage Dashboard %s\n' "${GITHUB_REF_NAME}" > "${notes}"
          fi
          # shellcheck disable=SC2046
          gh release create "${GITHUB_REF_NAME}" $(find release -type f | sort) \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "AI Usage Dashboard ${GITHUB_REF_NAME}" \
            --notes-file "${notes}"
