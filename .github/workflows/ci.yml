name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test renderer
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Check Rust targets
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build Windows release bundles for review
        if: github.event_name == 'workflow_dispatch'
        run: npm run app:build

      - name: Install, reinstall, launch and uninstall Windows packages
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Run-Installer($file, $arguments) {
            $p = Start-Process -FilePath $file -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -notin @(0, 3010)) { throw "Installer failed: $file ($($p.ExitCode))" }
          }
          function Test-InstalledApp($exe) {
            if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
            $app = Start-Process -FilePath $exe -ArgumentList '--judge-demo' -PassThru
            try {
              Start-Sleep -Seconds 10
              if ($app.HasExited) { throw "Installed app exited: $($app.ExitCode)" }
              Write-Host "PASS installed application startup: $exe"
            } finally {
              if (-not $app.HasExited) { Stop-Process -Id $app.Id }
            }
          }
          $nsis = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName
          $dest = Join-Path $env:RUNNER_TEMP 'dashboard-nsis'
          Run-Installer $nsis "/S /D=$dest"
          Test-InstalledApp (Join-Path $dest 'ai-usage-dashboard.exe')
          Run-Installer $nsis "/S /D=$dest"
          Test-InstalledApp (Join-Path $dest 'ai-usage-dashboard.exe')
          $uninstaller = (Get-ChildItem $dest -Filter '*uninstall*.exe' | Select-Object -First 1).FullName
          if (-not $uninstaller) { throw 'NSIS uninstaller missing' }
          Run-Installer $uninstaller '/S'
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dest 'ai-usage-dashboard.exe')) { throw 'NSIS uninstall left executable behind' }
          Write-Host 'PASS NSIS install/reinstall/uninstall'
          $msi = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName
          $msiDest = Join-Path $env:RUNNER_TEMP 'dashboard-msi'
          $msiLog = Join-Path $env:RUNNER_TEMP 'dashboard-msi-install.log'
          Run-Installer 'msiexec.exe' "/i `"$msi`" /qn /norestart /L*v `"$msiLog`" INSTALLDIR=`"$msiDest`""
          # WiX can restore the previous NSIS directory from the product registry.
          # Validate the registered MSI location, not an assumed command-line override.
          $entries = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -eq 'AI Usage Dashboard' -and $_.WindowsInstaller -eq 1 })
          if ($entries.Count -ne 1 -or -not $entries[0].InstallLocation) {
            Get-Content $msiLog -Tail 100
            throw 'Expected exactly one MSI registration with an install location'
          }
          $msiDest = $entries[0].InstallLocation
          Write-Host "Registered MSI location: $msiDest"
          Test-InstalledApp (Join-Path $msiDest 'ai-usage-dashboard.exe')
          Run-Installer 'msiexec.exe' "/fa `"$msi`" /qn /norestart"
          Test-InstalledApp (Join-Path $msiDest 'ai-usage-dashboard.exe')
          Run-Installer 'msiexec.exe' "/x `"$msi`" /qn /norestart"
          if (Test-Path (Join-Path $msiDest 'ai-usage-dashboard.exe')) { throw 'MSI uninstall left executable behind' }
          Write-Host 'PASS MSI install/repair/uninstall'

      - name: Upload Windows review bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: review-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test renderer
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Check Rust targets
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Validate install script syntax
        run: |
          sh -n scripts/install-linux.sh
          sh -n scripts/install-macos.sh

      - name: Build Linux release bundles for review
        if: github.event_name == 'workflow_dispatch'
        run: npm run app:build

      - name: Install, reinstall, launch and uninstall Linux packages
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          smoke() {
            set +e
            xvfb-run -a timeout 10s "$@" --judge-demo
            result=$?
            set -e
            test "$result" -eq 124
            echo "PASS installed application startup: $*"
          }
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          package=$(dpkg-deb -f "$deb" Package)
          sudo apt-get install -y "$PWD/$deb"
          smoke /usr/bin/ai-usage-dashboard
          sudo dpkg -i "$deb"
          smoke /usr/bin/ai-usage-dashboard
          sudo dpkg --purge "$package"
          test ! -e /usr/bin/ai-usage-dashboard
          echo 'PASS DEB install/reinstall/uninstall'
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          installed="$RUNNER_TEMP/dashboard.AppImage"
          install -m 755 "$appimage" "$installed"
          smoke env APPIMAGE_EXTRACT_AND_RUN=1 "$installed"
          install -m 755 "$appimage" "$installed"
          smoke env APPIMAGE_EXTRACT_AND_RUN=1 "$installed"
          rm "$installed"
          test ! -e "$installed"
          echo 'PASS AppImage copy/replacement/removal (extract-and-run; no FUSE)'

      - name: Upload Linux review bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: review-linux
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Test renderer
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Check Rust targets
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust targets
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Build macOS release bundles for review
        if: github.event_name == 'workflow_dispatch'
        run: npm run app:build

      - name: Install, replace, launch and remove app from DMG
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/dashboard-volume"
          apps="$RUNNER_TEMP/Applications"
          mkdir -p "$mount" "$apps"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" || true' EXIT
          source_app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$source_app"
          installed="$apps/AI Usage Dashboard.app"
          smoke() {
            "$installed/Contents/MacOS/ai-usage-dashboard" --judge-demo &
            app_pid=$!
            sleep 10
            kill -0 "$app_pid"
            kill "$app_pid"
            wait "$app_pid" || true
            echo 'PASS installed macOS application startup'
          }
          ditto "$source_app" "$installed"
          smoke
          rm -rf "$installed"
          ditto "$source_app" "$installed"
          smoke
          rm -rf "$installed"
          test ! -e "$installed"
          hdiutil detach "$mount"
          trap - EXIT
          echo 'PASS DMG mount/copy/replacement/removal'

      - name: Upload macOS review bundles
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: review-macos
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 7
