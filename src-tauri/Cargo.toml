[package]
name = "ai-usage-dashboard"
version = "0.6.0"
description = "Local, cross-platform quota cockpit for Claude Code, Codex, Grok Build, and DeepSeek API balance"
authors = ["neyham"]
license = "MIT"
repository = "https://github.com/neyham/ai-usage-dashboard"
homepage = "https://github.com/neyham/ai-usage-dashboard"
edition = "2021"
rust-version = "1.88"

[lib]
name = "ai_usage_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt", "sync"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
base64 = "0.22"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
